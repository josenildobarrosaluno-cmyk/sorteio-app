<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteio — compre seus números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  <header class="masthead" id="masthead" style="display:none">
    <img id="org-logo" class="org-logo" style="display:none" alt="Logo">
    <span id="org-name" class="org-name"></span>
  </header>

  <div class="hero">
    <div class="ticket">
      <div class="ticket-grid">
        <div class="ticket-text">
          <h1 id="raffle-title">Carregando…</h1>
          <p class="desc" id="raffle-desc"></p>
          <div class="hero-meta">
            <div class="meta-item">
              <div class="label">Valor por número</div>
              <div class="value" id="raffle-price">—</div>
            </div>
            <div class="meta-item">
              <div class="label">Data do sorteio</div>
              <div class="value" id="raffle-date">a definir</div>
            </div>
            <div class="meta-item">
              <div class="label">Total de números</div>
              <div class="value" id="raffle-total">—</div>
            </div>
          </div>
        </div>
        <img id="prize-image" class="prize-image" style="display:none" alt="Foto do prêmio">
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="panel" id="grid-panel">
      <h2>Escolha seus números</h2>
      <div class="pack-options" id="pack-options"></div>
      <div class="custom-qty">
        <input type="number" id="custom-qty-input" min="1" placeholder="Quantidade personalizada">
        <button type="button" class="btn secondary" id="custom-qty-btn">Selecionar</button>
      </div>
      <div class="numbers-grid" id="numbers-grid"></div>
      <div class="legend">
        <span><i class="dot available"></i> Disponível</span>
        <span><i class="dot selected"></i> Selecionado</span>
        <span><i class="dot reserved"></i> Reservado</span>
        <span><i class="dot sold"></i> Vendido</span>
      </div>
    </div>

    <div class="panel" id="cart-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <h2 style="margin:0">Seu pedido</h2>
        <button type="button" class="btn secondary" id="clear-btn" style="width:auto;margin:0;padding:6px 14px;font-size:12px">Limpar seleção</button>
      </div>
      <div class="cart-list" id="cart-list">
        <span class="cart-empty">Nenhum número selecionado ainda</span>
      </div>
      <div id="upsell-hint"></div>
      <div class="total-row">
        <span class="label">Total</span>
        <span class="value" id="cart-total">R$ 0,00</span>
      </div>

      <label for="name">Nome completo</label>
      <input id="name" placeholder="Seu nome">

      <label for="phone">WhatsApp / Telefone</label>
      <input id="phone" placeholder="(00) 00000-0000">

      <label for="email">E-mail (opcional)</label>
      <input id="email" placeholder="voce@email.com">

      <label for="cpf">CPF (opcional)</label>
      <input id="cpf" placeholder="000.000.000-00">

      <button class="btn" id="buy-btn" disabled>Selecione um número</button>
      <div id="form-msg"></div>
    </div>
  </div>

  <footer>
    <a href="consulta.html">Já comprou? Consulte seus números</a><br><br>
    Pagamentos processados com segurança pelo Mercado Pago
  </footer>
</div>

<script src="js/main.js"></script>
</body>
</html>
